name: KKA Lean formal specification

on:
  push:
    branches: ["eis-kka-lean4-formal-001"]
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "EISKKA.lean"
      - "EISKKA/**"
      - ".github/workflows/kka-lean-formal.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "EISKKA.lean"
      - "EISKKA/**"
      - ".github/workflows/kka-lean-formal.yml"

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail"
      - name: Confirm no sorry tokens in formal source
        run: |
          if grep -R -n -E '\\bsorry\\b|\\baxiom\\b' EISKKA; then
            echo "Unreviewed sorry/axiom token found in formal source"
            exit 1
          fi
