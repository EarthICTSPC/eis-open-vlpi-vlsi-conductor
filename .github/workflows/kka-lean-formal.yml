name: KKA Lean formal specification

on:
  push:
    branches: ["eis-kka-lean4-formal-001"]
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "EISKKA.lean"
      - "EISKKA/**"
      - ".github/workflows/kka-lean-formal.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "EISKKA.lean"
      - "EISKKA/**"
      - ".github/workflows/kka-lean-formal.yml"

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lake dependencies
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build formal library
        run: lake build --wfail
      - name: Confirm no sorry or custom axiom declarations
        shell: bash
        run: |
          if grep -R -n -E '\bsorry\b|^[[:space:]]*axiom[[:space:]]' EISKKA; then
            echo "Unreviewed sorry/custom axiom declaration found in formal source"
            exit 1
          fi
