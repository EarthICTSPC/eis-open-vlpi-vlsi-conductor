name: EIS-OPT-INTERFERENCE-001

on:
  push:
    branches: [main, "feat/eis-opt-interference-001"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Resolve dependencies and build proofs
        run: |
          lake update
          lake build
