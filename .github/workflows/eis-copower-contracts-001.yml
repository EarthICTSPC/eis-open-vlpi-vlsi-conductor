name: EIS Co-Power Contracts

on:
  push:
    branches: ["feat/eis-copower-domains-001"]
  pull_request:
    branches: ["main", "feat/eis-opt-interference-001"]
  workflow_dispatch:

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build all EIS modules
        run: |
          lake update
          lake build
