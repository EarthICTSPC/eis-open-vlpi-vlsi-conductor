name: EIS Co-Power Contracts

on:
  push:
    branches: ["feat/eis-copower-domains-001", "feat/eis-4lc-coupled-001"]
  pull_request:
    branches: ["main", "feat/eis-opt-interference-001", "feat/eis-copower-domains-001"]
  workflow_dispatch:

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build all EIS modules
        run: |
          lake update
          lake build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run EIS-4LC-Coupled reference tests
        run: |
          python -m unittest discover -s experiments/eis-4lc-coupled-001 -p 'test_*.py' -v
