name: FlexAgent orchestration preflight

on:
  pull_request:
  push:
    branches:
      - experiment/eis-flexagent-orchestration-001

jobs:
  preflight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed orchestration tests
        run: python -m unittest discover -s tests/flexagent_orchestration -v
