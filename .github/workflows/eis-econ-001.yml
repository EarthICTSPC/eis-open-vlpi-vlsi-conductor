name: EIS-ECON-001 model and dashboard tests

on:
  push:
    branches:
      - "eis-econ-001-cost-accepted-transformation"
  pull_request:
    paths:
      - "experiments/EIS-ECON-001/**"
      - ".github/workflows/eis-econ-001.yml"
  workflow_dispatch:

jobs:
  python-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library model tests
        run: python -m unittest discover -s experiments/EIS-ECON-001 -p 'test_*.py' -v
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Generate scenario dashboard
        run: |
          python experiments/EIS-ECON-001/model.py --assumptions experiments/EIS-ECON-001/assumptions.json --inputs experiments/EIS-ECON-001/inputs --out /tmp/eis-econ-output
          python experiments/EIS-ECON-001/dashboard.py --assumptions experiments/EIS-ECON-001/assumptions.json --inputs experiments/EIS-ECON-001/inputs --out /tmp/eis-econ-output
          test -s /tmp/eis-econ-output/eis_econ_001_quarterly_dashboard.png
          test -s /tmp/eis-econ-output/california_reporting_readiness.json
