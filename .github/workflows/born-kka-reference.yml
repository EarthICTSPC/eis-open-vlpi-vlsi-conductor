name: EIS Born KKA reference

on:
  pull_request:
    paths:
      - "experiments/EIS-BORN-KKA-001/**"
      - "docs/experiments/EIS-BORN-KKA-001.md"
      - ".github/workflows/born-kka-reference.yml"

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run Born attention and energy ledger tests
        working-directory: experiments/EIS-BORN-KKA-001
        run: python -m pytest -q
